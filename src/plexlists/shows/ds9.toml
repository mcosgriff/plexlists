# Star Trek: Deep Space Nine.
# "Emissary", "The Way of the Warrior" and "What You Leave Behind" are double
# length; a title without a part number pulls in both halves if Plex splits them.

[show]
title = "Star Trek: Deep Space Nine"
label = "Star Trek: DS9"
prefix = "DS9: "
episode_minutes = 45
long_episodes = ["Emissary", "The Way of the Warrior", "What You Leave Behind"]
colors = { top = "#2a1a3a", bottom = "#08050c", accent = "#d9a441", text = "#f3eef7" }

[[playlists]]
key = "binge"
name = "Weekend Binge"
description = "The essential episodes, from Emissary to What You Leave Behind"
