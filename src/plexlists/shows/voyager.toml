# Star Trek: Voyager.
# "Caretaker", "Dark Frontier", "Flesh and Blood" and "Endgame" are double length;
# a title without a part number pulls in both halves if Plex splits them.

[show]
title = "Star Trek: Voyager"
label = "Star Trek: VOY"
prefix = "VOY: "
episode_minutes = 45
long_episodes = ["Caretaker", "Dark Frontier", "Flesh and Blood", "Endgame"]
colors = { top = "#102a3c", bottom = "#03080c", accent = "#e0a23c", text = "#eef4f7" }

[[playlists]]
key = "binge"
name = "Weekend Binge"
description = "The essential episodes, from Caretaker to Endgame"
poster_from = "Year of Hell (1)"
episodes = [
    [1, "Caretaker", "Friday night"],
    [1, "Eye of the Needle"],
    [2, "Death Wish"],
    [2, "Tuvix"],
    [3, "Future's End (1)"],
    [3, "Future's End (2)"],
    [3, "Distant Origin"],
    [3, "Scorpion (1)", "Saturday"],
    [4, "Scorpion (2)"],
    [4, "Year of Hell (1)"],
    [4, "Year of Hell (2)"],
    [4, "Message in a Bottle"],
    [4, "Living Witness"],
    [5, "Timeless"],
    [5, "Bride of Chaotica!"],
    [5, "Dark Frontier"],
    [5, "Equinox (1)", "Sunday"],
