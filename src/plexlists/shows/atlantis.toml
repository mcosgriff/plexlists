# Stargate Atlantis.
# "The Siege" is a three-parter that spans seasons one and two, so each part is
# listed explicitly.

[show]
title = "Stargate Atlantis"
label = "Stargate Atlantis"
prefix = "SGA: "
episode_minutes = 44
long_episodes = ["Rising"]
colors = { top = "#0f2f4f", bottom = "#030a12", accent = "#7fd6c2", text = "#eef5f7" }

