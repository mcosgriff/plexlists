# The X-Files. Episodes are matched by title, so DVD vs. aired order doesn't matter.

[show]
title = "The X-Files"
label = "The X-Files"
prefix = "X-Files: "
episode_minutes = 44
colors = { top = "#14231a", bottom = "#030604", accent = "#6fdc8c", text = "#eef5ef" }

[films.fight_the_future]
name = "The X-Files: Fight the Future"
search = "X-Files"
year = 1998
minutes = 121

