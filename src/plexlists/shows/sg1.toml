# Stargate SG-1.
# Two-parters within a season list each part; cliffhangers that span seasons
# ("Nemesis" / "Small Victories") have their own titles.

[show]
title = "Stargate SG-1"
label = "Stargate SG-1"
prefix = "SG-1: "
episode_minutes = 44
long_episodes = ["Children of the Gods"]
colors = { top = "#12303a", bottom = "#03090c", accent = "#5cc8e8", text = "#eef6f8" }

[films.stargate]
name = "Stargate"
search = "Stargate"
year = 1994
minutes = 116

[films.ark_of_truth]
name = "Stargate: The Ark of Truth"
search = "Ark of Truth"
year = 2008
minutes = 97

[films.continuum]
name = "Stargate: Continuum"
search = "Continuum"
year = 2008
minutes = 98

