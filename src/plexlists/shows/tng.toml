# Star Trek: The Next Generation.
# A title without a part number ("Encounter at Farpoint") pulls in every part Plex
# has in that season, in order. Two-parters that span seasons ("The Best of Both
# Worlds") list each part explicitly.

[show]
title = "Star Trek: The Next Generation"
label = "Star Trek: TNG"
prefix = "TNG: "
episode_minutes = 45
long_episodes = ["All Good Things...", "Encounter at Farpoint"]
colors = { top = "#1a2140", bottom = "#05060f", accent = "#f2a93b", text = "#f4f1ea" }

[films.generations]
name = "Star Trek Generations"
search = "Generations"
year = 1994
minutes = 118

[films.first_contact]
name = "Star Trek: First Contact"
search = "First Contact"
year = 1996
minutes = 111

[films.insurrection]
name = "Star Trek: Insurrection"
search = "Insurrection"
year = 1998
minutes = 103

[films.nemesis]
name = "Star Trek: Nemesis"
search = "Nemesis"
year = 2002
minutes = 116

[[playlists]]
key = "binge"
name = "Weekend Binge"
description = "The essential episodes, from Farpoint to All Good Things"
poster_from = "The Inner Light"
episodes = [
    [1, "Encounter at Farpoint", "Friday night"],
    [2, "Elementary, Dear Data"],
    [2, "The Measure of a Man"],
    [2, "Q Who"],
    [3, "Yesterday's Enterprise", "Saturday"],
    [3, "The Offspring"],
    [3, "Sins of the Father"],
    [3, "Sarek"],
    [3, "The Best of Both Worlds (1)"],
    [4, "The Best of Both Worlds (2)"],
    [4, "Family"],
    [4, "The Drumhead"],
    [5, "Darmok"],
    [5, "I, Borg"],
    [5, "Cause and Effect"],
    [5, "The Inner Light", "Sunday"],
    [6, "Relics"],
    [6, "Chain of Command (1)"],
    [6, "Chain of Command (2)"],
    [6, "Tapestry"],
    [7, "Lower Decks"],
    [7, "Parallels"],
    [7, "The Pegasus"],
    [7, "All Good Things...", "Series finale"],
]

